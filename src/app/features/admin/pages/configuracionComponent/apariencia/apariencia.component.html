<div class="form-container">
    <div class="form-header">
        <button class="back-btn" (click)="goBack()">
            <span class="material-icons">arrow_back</span>
            Volver
        </button>
        <h2>🎨 Apariencia</h2>
    </div>

    <form [formGroup]="appearanceForm" (ngSubmit)="onSubmit()" class="settings-form">
        <div class="form-grid">
            <div class="form-group checkbox-group full-width"
                style="margin-bottom: 2rem; border-bottom: 1px dashed #e2e8f0; padding-bottom: 1rem;">
                <input type="checkbox" id="useAutoTheme" formControlName="useAutoTheme">
                <label for="useAutoTheme" style="font-weight: 600; color: var(--primary);">🌗 Programación Automática
                    (Modo Claro 8am-8pm / Oscuro 8pm-8am)</label>
            </div>

            <div class="form-group" [style.opacity]="appearanceForm.get('useAutoTheme')?.value ? '0.5' : '1'"
                [style.pointer-events]="appearanceForm.get('useAutoTheme')?.value ? 'none' : 'auto'">
                <label for="darkMode">Modo de visualización manual</label>
                <select id="darkMode" formControlName="darkMode">
                    <option [ngValue]="false">Modo Claro</option>
                    <option [ngValue]="true">Modo Oscuro</option>
                </select>
                <small *ngIf="appearanceForm.get('useAutoTheme')?.value"
                    style="color: #64748b; display: block; margin-top: 0.5rem;">
                    * Desactiva la programación automática para cambiar el modo manualmente.
                </small>
            </div>

            <div class="form-group">
                <label for="primaryColor">Color principal del sistema</label>
                <div class="color-picker-container">
                    <input type="color" id="primaryColor" formControlName="primaryColor">
                    <span>{{ appearanceForm.get('primaryColor')?.value }}</span>
                </div>
            </div>

            <!-- Foto de perfil Admin → aparece en el Header -->
            <div class="form-group full-width"
                style="border: 1px solid #e2e8f0; border-radius: 12px; padding: 1.5rem; background: #f8fafc;">
                <label style="font-weight: 700; font-size: 1rem; color: #1e293b; display: block; margin-bottom: 1rem;">
                    👤 Foto de perfil del Admin
                </label>
                <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                    <img [src]="currentAvatar" alt="Avatar actual"
                        style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                    <div>
                        <p style="margin: 0 0 0.5rem; color: #64748b; font-size: 0.875rem;">Foto actual. Sube una nueva
                            para reemplazarla.</p>
                        <input type="file" (change)="onAdminAvatarUpload($event)" accept="image/*" class="file-input">
                    </div>
                </div>
            </div>



            <div class="form-group">
                <label>Subir favicon</label>
                <input type="file" (change)="onFileUpload($event, 'favicon')" accept="image/*" class="file-input">
            </div>

            <div class="form-group checkbox-group full-width">
                <input type="checkbox" id="showLogoInSidebar" formControlName="showLogoInSidebar">
                <label for="showLogoInSidebar">Mostrar logo en sidebar</label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="save-btn">Guardar Cambios</button>
        </div>
    </form>
</div>
