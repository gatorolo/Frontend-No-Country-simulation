<div class="form-container">
    <div class="form-header">
        <button class="back-btn" (click)="goBack()">
            <span class="material-icons">arrow_back</span>
            Volver
        </button>
        <h2>🎨 Apariencia</h2>
    </div>

    <form [formGroup]="appearanceForm" (ngSubmit)="onSubmit()" class="settings-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="darkMode">Modo de visualización</label>
                <select id="darkMode" formControlName="darkMode">
                    <option [ngValue]="false">Modo Claro</option>
                    <option [ngValue]="true">Modo Oscuro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="primaryColor">Color principal del sistema</label>
                <div class="color-picker-container">
                    <input type="color" id="primaryColor" formControlName="primaryColor">
                    <span>{{ appearanceForm.get('primaryColor')?.value }}</span>
                </div>
            </div>

            <div class="form-group">
                <label>Subir logo (Header/Login)</label>
                <input type="file" (change)="onFileUpload($event, 'logo')" accept="image/*" class="file-input">
            </div>

            <div class="form-group">
                <label>Subir favicon</label>
                <input type="file" (change)="onFileUpload($event, 'favicon')" accept="image/*" class="file-input">
            </div>

            <div class="form-group checkbox-group full-width">
                <input type="checkbox" id="showLogoInSidebar" formControlName="showLogoInSidebar">
                <label for="showLogoInSidebar">Mostrar logo en sidebar</label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="save-btn">Guardar Cambios</button>
        </div>
    </form>
</div>
