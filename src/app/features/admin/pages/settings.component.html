<div class="settings-container">
  <!-- Grid shown only on the main settings page -->
  <div *ngIf="!isSubRouteActive()">
    <div class="settings-header">
      <h1 class="page-title">Configuración del Sistema</h1>
      <p class="page-subtitle">Gestiona todos los parámetros y preferencias de la aplicación</p>
    </div>

    <div class="settings-grid">
      <div *ngFor="let item of settingsCategories" (click)="navigateTo(item.route)" class="setting-card">
        <div class="setting-icon" [ngClass]="item.color">
          <span class="material-icons">{{ item.icon }}</span>
        </div>
        <div class="setting-info">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
        <div class="setting-action">
          <span class="material-icons">chevron_right</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed view for sub-routes -->
  <div *ngIf="isSubRouteActive()" class="child-view">
    <router-outlet></router-outlet>
  </div>
</div>
