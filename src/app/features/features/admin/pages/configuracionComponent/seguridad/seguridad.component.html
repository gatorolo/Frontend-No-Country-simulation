<div class="form-container">
    <div class="form-header">
        <button class="back-btn" (click)="goBack()">
            <span class="material-icons">arrow_back</span>
            Volver
        </button>
        <h2>🔐 Seguridad</h2>
    </div>

    <form [formGroup]="securityForm" (ngSubmit)="onSubmit()" class="settings-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="newPassword">Cambiar contraseña del administrador</label>
                <input type="password" id="newPassword" formControlName="newPassword" placeholder="Nueva contraseña">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Confirmar">
            </div>

            <div class="form-group checkbox-group full-width">
                <input type="checkbox" id="requireStrongPassword" formControlName="requireStrongPassword">
                <label for="requireStrongPassword">Requerir contraseña fuerte (mín. 8 caracteres, números y
                    símbolos)</label>
            </div>

            <div class="form-group">
                <label for="sessionExpiration">Tiempo de expiración de sesión</label>
                <select id="sessionExpiration" formControlName="sessionExpiration">
                    <option value="15min">15 min</option>
                    <option value="30min">30 min</option>
                    <option value="1h">1 h</option>
                </select>
            </div>

            <div class="form-group">
                <label for="allowMultipleSessions">Permitir múltiples sesiones</label>
                <select id="allowMultipleSessions" formControlName="allowMultipleSessions">
                    <option [ngValue]="true">Sí</option>
                    <option [ngValue]="false">No</option>
                </select>
            </div>
        </div>

        <div class="form-actions-extended">
            <button type="button" class="danger-btn" (click)="closeAllSessions()">Cerrar todas las sesiones</button>
            <button type="submit" class="save-btn">Guardar Cambios</button>
        </div>
    </form>
</div>
