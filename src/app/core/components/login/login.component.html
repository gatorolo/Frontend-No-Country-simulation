<div class="login-container">
    <div class="login-card">
        <div class="brand">
            <img src="assets/logoV3.png" alt="Valora Logo" class="brand-logo" style="height: 84px;">
            <p>Gestión Integral de Cuidados</p>
        </div>

        <form *ngIf="!show2FAForm" (submit)="onLogin(); $event.preventDefault()">
            <!-- ... (existing form content) ... -->
            <div class="form-group">
                <label for="email">Usuario / Email</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">person</span>
                    <input type="text" id="email" [(ngModel)]="username" name="username"
                        placeholder="nombre@empresa.com" class="form-control" autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="role">Ingresar como</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">badge</span>
                    <select id="role" [(ngModel)]="selectedRole" name="role" class="form-control">
                        <option value="admin">Administrador</option>
                        <option value="caregiver">Acompañante / Cuidador</option>
                        <option value="patient">Paciente / Familia</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <a routerLink="/forgot-password" class="forgot-pass">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading">
                <span *ngIf="!isLoading">Ingresar</span>
                <div *ngIf="isLoading" class="spinner"></div>
            </button>

            <!-- REGISTRATION BUTTONS -->
            <div style="margin-top: 1rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 0.75rem;">¿Eres un usuario nuevo?</p>

                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button type="button" class="btn-login" routerLink="/register"
                        style="background-color: white; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); height: auto; min-height: 48px; padding: 10px 16px;">
                        <span
                            style="display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;">
                            <span style="display: flex; align-items: center; gap: 8px; font-weight: 700;">
                                <span class="material-icons" style="font-size: 1.1rem;">person_add</span>
                                Solicitar Cuenta (Cuidador/Familia)
                            </span>
                        </span>
                    </button>

                    <button type="button" class="btn-login" routerLink="/admin-register"
                        style="background-color: #f8fafc; color: #64748b; border: 1px dashed #cbd5e1; height: auto; min-height: 40px; padding: 8px 16px; font-size: 0.85rem;">
                        <span style="display: flex; align-items: center; justify-content: center; gap: 6px;">
                            <span class="material-icons" style="font-size: 1rem;">admin_panel_settings</span>
                            Registrar Administrador Inicial
                        </span>
                    </button>
                </div>
            </div>
        </form>

        <!-- 2FA Verification Form -->
        <form *ngIf="show2FAForm" (submit)="onVerify2FA(); $event.preventDefault()">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span class="material-icons" style="font-size: 3rem; color: #0ea5e9;">security</span>
                <h3 style="margin-top: 1rem;">Verificación de Dos Pasos</h3>
                <p style="color: #64748b; font-size: 0.9rem;">Ingresa el código de 6 dígitos de tu aplicación de
                    autenticación.</p>
            </div>

            <div class="form-group">
                <label for="twoFactorCode">Código de Seguridad</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">pin</span>
                    <input type="text" id="twoFactorCode" [(ngModel)]="twoFactorCode" name="twoFactorCode"
                        placeholder="000 000" class="form-control" maxlength="6" autocomplete="off" required>
                </div>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading">
                <span *ngIf="!isLoading">Verificar</span>
                <div *ngIf="isLoading" class="spinner"></div>
            </button>

            <button type="button" class="btn-login" (click)="show2FAForm = false"
                style="background: transparent; color: #64748b; margin-top: 1rem; border: none; font-size: 0.9rem;">
                Volver al inicio de sesión
            </button>
        </form>
    </div>
</div>
