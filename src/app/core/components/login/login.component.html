<div class="login-container">
    <div class="login-card">
        <div class="brand">
            <img src="assets/logoV3.png" alt="Valora Logo" class="brand-logo" style="height: 90px;">
            <p>Gestión Integral de Cuidados</p>
        </div>

        <form (submit)="onLogin(); $event.preventDefault()">
            <div class="form-group">
                <label for="email">Usuario / Email</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">person</span>
                    <input type="text" id="email" [(ngModel)]="username" name="username"
                        placeholder="nombre@empresa.com" class="form-control" autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="password" placeholder="••••••••" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="role">Ingresar como</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">badge</span>
                    <select id="role" [(ngModel)]="selectedRole" name="role" class="form-control">
                        <option value="admin">Administrador</option>
                        <option value="caregiver">Acompañante / Cuidador</option>
                        <option value="patient">Paciente / Familia</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <a href="#" class="forgot-pass">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading">
                <span *ngIf="!isLoading">Ingresar</span>
                <div *ngIf="isLoading" class="spinner"></div>
            </button>

            <!-- REGISTRATION BUTTON -->
            <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1.5rem;">
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 0.75rem;">¿Eres un usuario nuevo?</p>
                <button type="button" class="btn-login" routerLink="/register"
                    style="background-color: white; color: #1e293b; border: 1px solid #cbd5e1; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); height: auto; min-height: 48px; padding: 10px 16px;">
                    <span
                        style="display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;">
                        <span style="display: flex; align-items: center; gap: 8px; font-weight: 700;">
                            <span class="material-icons" style="font-size: 1.1rem;">person_add</span>
                            Crear una Cuenta
                        </span>
                        <small style="font-size: 0.75rem; color: #64748b; font-weight: 500; margin-top: 2px;">(necesita
                            aprobación)</small>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
