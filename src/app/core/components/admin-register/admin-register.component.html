<div class="login-container">
    <div class="login-card">
        <div class="brand">
            <img src="assets/logoV3.png" alt="Valora Logo" class="brand-logo" style="height: 90px;">
            <p>Registro Inicial de Administrador</p>
        </div>

        <form (submit)="onSubmit(); $event.preventDefault()">
            <div class="form-group">
                <label for="username">Usuario / Email del Administrador</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">person</span>
                    <input type="text" id="username" [(ngModel)]="username" name="username"
                        placeholder="admin@valora.com" class="form-control" autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">lock_reset</span>
                    <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
                        placeholder="••••••••" class="form-control" required>
                </div>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading" style="margin-top: 2rem;">
                <span *ngIf="!isLoading">Crear Administrador</span>
                <div *ngIf="isLoading" class="spinner"></div>
            </button>

            <div class="actions" style="margin-top: 1.5rem; text-align: center;">
                <a routerLink="/login" class="forgot-pass">Volver al login</a>
            </div>
        </form>
    </div>
</div>
