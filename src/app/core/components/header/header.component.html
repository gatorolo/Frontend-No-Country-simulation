<header class="app-header">
  <div class="logo-container">

    <div class="logo-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          fill="#F4C430" />
      </svg>
    </div>
    <span class="brand-name">Valora</span>
  </div>

  <div class="header-actions">

    <button class="icon-btn">
      <span class="material-icons bell">notifications</span>
    </button>
    <div class="user-profile" style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:14px;font-weight:600;color:#334155;">{{ userName }}</span>
      <img [src]="userAvatar" alt="Avatar" class="avatar"
        style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;">
    </div>
  </div>
</header>
