<div class="login-container">
    <div class="login-card">
        <div class="brand">
            <img src="assets/logoV3.png" alt="Valora Logo" class="brand-logo" style="height: 90px;">
            <p>Recuperar Contraseña</p>
        </div>

        <form (submit)="onSubmit(); $event.preventDefault()">
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">
                Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <span class="material-icons input-icon">email</span>
                    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="tu@correo.com"
                        class="form-control" autocomplete="off" required>
                </div>
            </div>

            <button type="submit" class="btn-login" [disabled]="isLoading" style="margin-top: 2rem;">
                <span *ngIf="!isLoading">Enviar Enlace</span>
                <div *ngIf="isLoading" class="spinner"></div>
            </button>

            <div class="actions" style="margin-top: 1.5rem; text-align: center;">
                <a routerLink="/login" class="forgot-pass">Volver al Inicio de Sesión</a>
            </div>
        </form>
    </div>
</div>
